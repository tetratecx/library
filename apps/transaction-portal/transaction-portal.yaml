##################################################################################################
# Transaction Portal Service
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  name: transaction-portal
  labels:
    app: transaction-portal
    service: transaction-portal
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: transaction-portal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transaction-portal
  labels:
    account: transaction-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-portal-v1
  labels:
    app: transaction-portal
    version: v1
spec:
  replicas: 0
  selector:
    matchLabels:
      app: transaction-portal
      version: v1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9080"
        prometheus.io/path: "/metrics"
      labels:
        app: transaction-portal
        version: v1
    spec:
      serviceAccountName: transaction-portal
      containers:
      - name: transaction-portal
        image: us-east1-docker.pkg.dev/dogfood-cx/registryrepository/giraffe:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9080
        env:
        - name: SERVICE_NAME
          value: "transaction-portal"
        - name: SERVICE_VERSION
          value: "v1"
        - name: SERVICE_PORT
          value: "9080"
        - name: UPSTREAM_URLS
          value: "http://account-service:9080,http://fraud-detection:9080"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "otel-collector:4317"
        - name: INCLUDE_HEADERS
          value: "true"
        - name: RESPONSE_FIELD_PORTAL_VERSION
          value: "basic"
        - name: RESPONSE_FIELD_TRANSACTION_TYPE
          value: "standard"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-portal-v2
  labels:
    app: transaction-portal
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-portal
      version: v2
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9080"
        prometheus.io/path: "/metrics"
      labels:
        app: transaction-portal
        version: v2
    spec:
      serviceAccountName: transaction-portal
      containers:
      - name: transaction-portal
        image: us-east1-docker.pkg.dev/dogfood-cx/registryrepository/giraffe:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9080
        env:
        - name: SERVICE_NAME
          value: "transaction-portal"
        - name: SERVICE_VERSION
          value: "v2"
        - name: SERVICE_PORT
          value: "9080"
        - name: UPSTREAM_URLS
          value: "http://account-service:9080,http://fraud-detection:9080,http://risk-assessment:9080"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "otel-collector:4317"
        - name: INCLUDE_HEADERS
          value: "true"
        - name: INCLUDE_QUERY
          value: "true"
        - name: RESPONSE_FIELD_PORTAL_VERSION
          value: "enhanced"
        - name: RESPONSE_FIELD_TRANSACTION_TYPE
          value: "comprehensive"
        - name: RESPONSE_FIELD_VENDOR_CHECK
          value: "enabled"
        - name: RESPONSE_DELAY_MS
          value: "100"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
---
##################################################################################################
# Traffic Generator for Transaction Portal
##################################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-traffic-generator
  labels:
    app: transaction-traffic-generator
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-traffic-generator
      version: v1
  template:
    metadata:
      labels:
        app: transaction-traffic-generator
        version: v1
    spec:
      containers:
      - name: traffic-generator
        image: us-east1-docker.pkg.dev/dogfood-cx/registryrepository/giraffe:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9080
        env:
        - name: SERVICE_NAME
          value: "transaction-traffic-generator"
        - name: SERVICE_VERSION
          value: "v1"
        - name: SERVICE_PORT
          value: "9080"
        - name: UPSTREAM_URLS
          value: "http://transaction-portal:9080"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "otel-collector:4317"
        - name: INCLUDE_HEADERS
          value: "true"
        - name: RESPONSE_FIELD_GENERATOR_TYPE
          value: "transaction_load_tester"
        - name: RESPONSE_FIELD_TARGET_SERVICE
          value: "transaction-portal"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName