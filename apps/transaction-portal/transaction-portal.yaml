##################################################################################################
# This file defines the services, service accounts, and deployments for the Transaction Portal sample
# using the Giraffe unified service mesh testing tool.
#
# To apply all Transaction Portal services, their corresponding service accounts, and deployments:
#
#   kubectl apply -f transaction-portal.yaml
#
# Alternatively, you can deploy any resource separately:
#
#   kubectl apply -f transaction-portal.yaml -l service=fraud-detection # fraud-detection Service
#   kubectl apply -f transaction-portal.yaml -l account=fraud-detection # fraud-detection ServiceAccount
#   kubectl apply -f transaction-portal.yaml -l app=fraud-detection,version=v2 # fraud-detection-v2 Deployment
##################################################################################################

##################################################################################################
# Account Service
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  name: account-service
  labels:
    app: account-service
    service: account-service
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: account-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transaction-account-service
  labels:
    account: account-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service-v1
  labels:
    app: account-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
      version: v1
  template:
    metadata:
      labels:
        app: account-service
        version: v1
    spec:
      serviceAccountName: transaction-account-service
      containers:
      - name: account-service
        image: us-east1-docker.pkg.dev/dogfood-cx/registryrepository/giraffe:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9080
        env:
        - name: SERVICE_NAME
          value: "account-service"
        - name: SERVICE_VERSION
          value: "v1"
        - name: SERVICE_PORT
          value: "9080"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "otel-collector:4317"
        - name: CALL_UPSTREAMS
          value: "false"
        - name: RESPONSE_TEMPLATE
          value: '{"service":"account-service","account_id":"12345","account_type":"checking","balance":1500.00,"status":"active","last_activity":"2024-01-01T10:00:00Z"}'
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service-v2
  labels:
    app: account-service
    version: v2
spec:
  replicas: 0
  selector:
    matchLabels:
      app: account-service
      version: v2
  template:
    metadata:
      labels:
        app: account-service
        version: v2
    spec:
      serviceAccountName: transaction-account-service
      containers:
      - name: account-service
        image: us-east1-docker.pkg.dev/dogfood-cx/registryrepository/giraffe:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9080
        env:
        - name: SERVICE_NAME
          value: "account-service"
        - name: SERVICE_VERSION
          value: "v2"
        - name: SERVICE_PORT
          value: "9080"
        - name: ERROR_RATE
          value: "1.0"
        - name: ERROR_STATUS_CODE
          value: "503"
        - name: ERROR_MESSAGE
          value: "Account service temporarily unavailable"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "otel-collector:4317"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
---
